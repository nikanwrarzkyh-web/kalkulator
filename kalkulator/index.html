<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Ilmiah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <div class="mode-bar">
      <span class="mode-label" id="modeLabel">DEG</span>
      <button class="mode-toggle" onclick="toggleMode()" id="modeToggle">2nd</button>
    </div>
    <div class="display" id="display">0</div>
    <div class="buttons" id="buttons">
      <!-- Scientific row -->
      <button class="btn sci" onclick="scientificFunc('sin')">sin</button>
      <button class="btn sci" onclick="scientificFunc('cos')">cos</button>
      <button class="btn sci" onclick="scientificFunc('tan')">tan</button>
      <button class="btn sci" onclick="scientificFunc('log')">log</button>

      <button class="btn sci" onclick="scientificFunc('ln')">ln</button>
      <button class="btn sci" onclick="scientificFunc('sqrt')">√</button>
      <button class="btn sci" onclick="scientificFunc('square')">x²</button>
      <button class="btn sci" onclick="openParen()">(</button>

      <!-- Main row 1 -->
      <button class="btn utility" id="btnClear" onclick="clearDisplay()">AC</button>
      <button class="btn utility" onclick="negate()">±</button>
      <button class="btn utility" onclick="appendOperator('%')">%</button>
      <button class="btn operator" onclick="appendOperator('/')">÷</button>

      <button class="btn number" onclick="appendNumber('7')">7</button>
      <button class="btn number" onclick="appendNumber('8')">8</button>
      <button class="btn number" onclick="appendNumber('9')">9</button>
      <button class="btn operator" onclick="appendOperator('*')">×</button>

      <button class="btn number" onclick="appendNumber('4')">4</button>
      <button class="btn number" onclick="appendNumber('5')">5</button>
      <button class="btn number" onclick="appendNumber('6')">6</button>
      <button class="btn operator" onclick="appendOperator('-')">−</button>

      <button class="btn number" onclick="appendNumber('1')">1</button>
      <button class="btn number" onclick="appendNumber('2')">2</button>
      <button class="btn number" onclick="appendNumber('3')">3</button>
      <button class="btn operator add" onclick="appendOperator('+')">+</button>

      <button class="btn number zero" onclick="appendNumber('0')">0</button>
      <button class="btn number" onclick="appendDot()">,</button>
      <button class="btn operator equal" onclick="calculate()">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
